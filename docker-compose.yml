version: '3.8'

services:
  # Backend - Java Spring Boot (porta 8080)
  backend:
    build: ./backend
    ports: ["8080:8080"]
    environment:
      - DB_HOST=postgres
      - DB_NAME=atendimento_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
    depends_on:
      postgres:
        condition: service_healthy

  # Frontend - React + Nginx (porta 3000)
  frontend:
    build: ./frontend
    ports: ["3000:80"]
    depends_on:
      - backend

  # Banco de Dados - PostgreSQL 15
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: atendimento_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5