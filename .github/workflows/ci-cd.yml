name: CI/CD Pipeline - Atendimento Hospitalar

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ========================================
  # JOB 1: TESTES DO BACKEND (Java/Spring Boot)
  # ========================================
  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: atendimento_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: ☕ Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: 🧪 Testes Unitários e de Integração
        run: mvn test -B
        working-directory: ./backend
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: atendimento_test
          DB_USER: postgres
          DB_PASSWORD: postgres

  # ========================================
  # JOB 2: BUILD DO FRONTEND (React)
  # ========================================
  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 🟢 Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package.json'
      - name: 🏗️ Instalar Dependências e Build
        run: |
          npm install
          npm run build
        working-directory: ./frontend

  # ========================================
  # JOB 3: DEPLOY NO RENDER (CD)
  # ========================================
  deploy-render:
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 Disparar Deploy do Backend (Render)
        run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}
      
      - name: 🚀 Disparar Deploy do Frontend (Render)
        run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}